name: PowerShell Quality Gate

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: PowerShell quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PowerShell test dependencies
        shell: pwsh
        run: |
          Set-PSRepository `
            -Name PSGallery `
            -InstallationPolicy Trusted

          Install-Module `
            -Name Pester `
            -RequiredVersion 4.10.1 `
            -Scope CurrentUser `
            -Force `
            -SkipPublisherCheck

          Install-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion 1.24.0 `
            -Scope CurrentUser `
            -Force

      - name: Install Azure modules required by tests
        shell: pwsh
        run: |
          $modules = @(
            "Az.Accounts"
            "Az.Resources"
            "Az.Network"
            "Az.Storage"
            "Az.KeyVault"
            "Az.Websites"
            "Az.ApplicationInsights"
            "Az.Monitor"
            "Az.Compute"
            "Az.PrivateDns"
          )

          foreach ($module in $modules) {
            Install-Module `
              -Name $module `
              -Scope CurrentUser `
              -Force `
              -AllowClobber
          }

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = @()

          Get-ChildItem `
            -Path ./automation `
            -Include *.ps1, *.psm1 `
            -Recurse |
            ForEach-Object {
              $tokens = $null
              $errors = $null

              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )

              if ($errors.Count -gt 0) {
                foreach ($errorRecord in $errors) {
                  $parseErrors += [pscustomobject]@{
                    File    = $_.FullName
                    Line    = $errorRecord.Extent.StartLineNumber
                    Message = $errorRecord.Message
                  }
                }
              }
            }

          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-Table -AutoSize
            throw "PowerShell syntax validation failed."
          }

          Write-Host "PowerShell syntax validation passed."

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module `
            -Name PSScriptAnalyzer `
            -RequiredVersion 1.24.0 `
            -ErrorAction Stop

          $analysisErrors = @(
            Invoke-ScriptAnalyzer `
              -Path ./automation `
              -Recurse |
            Where-Object {
              $_.Severity -in @("Error", "ParseError")
            }
          )

          if ($analysisErrors.Count -gt 0) {
            $analysisErrors |
              Format-Table `
                ScriptPath,
                Line,
                RuleName,
                Severity,
                Message `
                -AutoSize

            throw "PSScriptAnalyzer detected blocking errors."
          }

          Write-Host "PSScriptAnalyzer validation passed."

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module `
            -Name Pester `
            -RequiredVersion 4.10.1 `
            -Force `
            -ErrorAction Stop

          $result = Invoke-Pester `
            -Script ./automation/tests `
            -PassThru

          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

          if ($result.TotalCount -eq 0) {
            throw "No Pester tests were discovered."
          }

          Write-Host (
            "Pester completed: {0} passed, {1} failed." -f `
              $result.PassedCount,
              $result.FailedCount
          )

      - name: Validate JSON files
        shell: pwsh
        run: |
          $jsonErrors = @()

          Get-ChildItem `
            -Path . `
            -Filter *.json `
            -Recurse |
            ForEach-Object {
              try {
                Get-Content `
                  -Path $_.FullName `
                  -Raw `
                  -ErrorAction Stop |
                ConvertFrom-Json `
                  -ErrorAction Stop |
                Out-Null
              }
              catch {
                $jsonErrors += [pscustomobject]@{
                  File    = $_.FullName
                  Message = $_.Exception.Message
                }
              }
            }

          if ($jsonErrors.Count -gt 0) {
            $jsonErrors | Format-Table -AutoSize
            throw "JSON validation failed."
          }

          Write-Host "JSON validation passed."

      - name: Install actionlint
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          "$(go env GOPATH)/bin/actionlint" -color
