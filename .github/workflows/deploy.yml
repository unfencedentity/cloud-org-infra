name: Deploy Azure infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name"
        required: true
        default: "dev"
      app:
        description: "Application name"
        required: true
        default: "core"
      region:
        description: "Region code"
        required: true
        default: "deu"
      location:
        description: "Azure location"
        required: true
        default: "denmarkeast"
      monitoring_location:
        description: "Azure location for monitoring resources"
        required: true
        default: "swedencentral"
      vm_size:
        description: "VM size"
        required: true
        default: "Standard_B1s"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write     # required for OIDC token
      contents: read      # required for checkout

    steps:
      - name: Pre Azure Login (OIDC)
        run: echo "Starting OIDC login…"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      # Ensure required Az modules are available in the runner
      - name: Install Az modules
        uses: azure/powershell@v1
        with:
          inlineScript: |
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

            Install-Module Az.Accounts            -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.Resources           -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.OperationalInsights -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.Monitor             -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.KeyVault            -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.Storage             -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.Network             -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.Websites            -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.ApplicationInsights -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.ManagedServiceIdentity -Force -AllowClobber -Scope CurrentUser
            Install-Module Az.PrivateDns          -Force -AllowClobber -Scope CurrentUser

            Write-Host "Az modules installed:"
            Get-Module Az.* -ListAvailable | Select-Object Name, Version
          azPSVersion: latest

      - name: Deploy environment
        uses: azure/powershell@v1
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          inlineScript: |
            ./automation/deploy-environment.ps1 `
              -Environment "${{ github.event.inputs.environment || 'dev' }}" `
              -App "${{ github.event.inputs.app || 'core' }}" `
              -Region "${{ github.event.inputs.region || 'deu' }}" `
              -Location "${{ github.event.inputs.location || 'denmarkeast' }}" `
              -MonitoringLocation "${{ github.event.inputs.monitoring_location || 'swedencentral' }}" `
              -VmSize "${{ github.event.inputs.vm_size || 'Standard_B1s' }}" `
              -SubscriptionId "${{ secrets.AZURE_SUBSCRIPTION_ID }}" `
              -TenantId "${{ secrets.AZURE_TENANT_ID }}"
          azPSVersion: latest

      - name: Post Azure Login (OIDC)
        if: always()
        run: echo "Deployment finished."
